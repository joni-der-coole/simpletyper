<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zahlen Pad</title>
    <style>
        html, body {
            background: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
        }
        #box {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 70px;
            text-align: center;
            width: 100%;
            height: 100vh;
            outline: none;
        }
    </style>
</head>
<body>

    <input type="tel" inputmode="numeric" pattern="[0-9]*" id="box" autofocus>

    <script>
        const box = document.getElementById('box');
        
        // Laden
        const saved = localStorage.getItem('ipad_num');
        if (saved) box.value = saved;

        // Speichern und Buchstaben blockieren
        box.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            localStorage.setItem('ipad_num', this.value);
        });
    </script>
</body>
</html>
